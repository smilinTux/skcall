name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  client:
    name: client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install
        run: |
          uv venv .venv -p 3.12
          uv pip install -p .venv/bin/python -e '.[test,voice]' -c sk/constraints.txt
      - name: pytest
        run: .venv/bin/python -m pytest -q

  services:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [tts, stt, lipsync]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install (fake engines, CPU only)
        working-directory: services/${{ matrix.service }}
        run: |
          uv venv .venv -p 3.12
          uv pip install -p .venv/bin/python -r requirements-test.txt
      - name: pytest
        working-directory: services/${{ matrix.service }}
        run: .venv/bin/python -m pytest -q
      - name: pytest services/common
        working-directory: services/common
        run: ../${{ matrix.service }}/.venv/bin/python -m pytest -q

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the tree
        run: '"$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --no-banner --redact'

