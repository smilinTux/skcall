[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skcall"
version = "0.2.0"
description = "AI agents as real participants in Nextcloud Talk (and later LiveKit) calls"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11,<3.13"
dependencies = ["aiortc>=1.9", "aiohttp>=3.10", "httpx>=0.27", "numpy>=1.26", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
voice = ["skchat-sovereign==0.14.266", "skvoice==0.2.9", "skmemory==0.11.172", "mcp==1.30.0", "pyyaml==6.0.3"]

[project.scripts]
skcall = "skcall.cli:main"

[tool.setuptools.packages.find]
include = ["skcall*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
